# ============================================================
# CI/CD AI Assistant — Auto-analysis on pipeline failure
# ============================================================
# HOW TO USE:
#   1. Copy this entire file into your repo at:
#      .github/workflows/ci-with-ai-analysis.yml
#   2. Replace the test step with your actual build/test commands
#   3. Add these two secrets in your GitHub repo:
#      Settings → Secrets and variables → Actions → New secret
#        CICD_ASSISTANT_API_URL  = http://your-server:8000
#        CICD_ASSISTANT_API_KEY  = (your API_KEY from .env, leave blank if not set)
#   4. Push a branch, open a PR, break a test — watch the
#      AI analysis appear as a PR comment automatically.
#
# DESIGN NOTE: build-and-test and the AI analysis run in the SAME job
# (not split across two jobs with an artifact hand-off). This avoids a
# real failure mode we hit in practice: actions/download-artifact can
# fail to unzip if the artifact wasn't flushed/uploaded cleanly before
# the job ended, silently starving the analysis step of any real log
# content. Keeping everything in one job means the log file is read
# directly off the same runner's disk — no upload/download round trip,
# no possible corruption, no silent "Could not be determined" fallback.
# ============================================================

name: CI with AI Failure Analysis

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test-and-analyze:
    name: Build, Test, and Analyze on Failure
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # needed to post PR comments
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Capture full output (stdout + stderr) to build.log AND let the
      # step itself fail normally if tests fail, so the job status is
      # accurate. `tee` writes to disk as output streams, so build.log
      # is guaranteed to exist and be flushed even if pytest crashes.
      - name: Run tests
        id: run_tests
        run: |
          set -o pipefail
          pytest --tb=long -v 2>&1 | tee build.log

      # Everything below only runs if the test step above failed.
      - name: Send failure log to CI/CD AI Assistant
        id: analysis
        if: failure() && steps.run_tests.outcome == 'failure'
        env:
          API_URL: ${{ secrets.CICD_ASSISTANT_API_URL }}
          API_KEY: ${{ secrets.CICD_ASSISTANT_API_KEY }}
        run: |
          # Read the log directly off disk — no artifact upload/download,
          # no network round trip, no chance of a corrupted zip.
          if [ -f build.log ]; then
            LOG_CONTENT=$(tail -c 6000 build.log)
          else
            LOG_CONTENT="build.log was not found on disk after the test step failed."
          fi

          PAYLOAD=$(jq -n \
            --arg pipeline "${{ github.workflow }}" \
            --arg repo     "${{ github.repository }}" \
            --arg sha      "${{ github.sha }}" \
            --arg log      "$LOG_CONTENT" \
            '{
              pipeline_name: $pipeline,
              repository:    $repo,
              commit_sha:    $sha,
              log:           $log,
              org_id:        "default"
            }')

          echo "----- Payload log preview (first 300 chars) -----"
          echo "$LOG_CONTENT" | head -c 300
          echo ""
          echo "---------------------------------------------------"

          HTTP_STATUS=$(curl -s -o analysis.json -w "%{http_code}" \
            -X POST "$API_URL/analyze" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            -d "$PAYLOAD" \
            --max-time 60)

          echo "HTTP status: $HTTP_STATUS"
          cat analysis.json
          echo ""

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "API call failed with status $HTTP_STATUS"
            echo '{"status":"FAILED","root_cause":null,"fix_suggestion":"AI Assistant API was unreachable.","confidence_level":null,"low_confidence_warning":true}' > analysis.json
          fi

      - name: Post AI analysis as PR comment
        if: failure() && steps.run_tests.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let analysis;
            try {
              analysis = JSON.parse(fs.readFileSync('analysis.json', 'utf8'));
            } catch (e) {
              analysis = {
                status: 'FAILED',
                root_cause: null,
                fix_suggestion: 'Could not parse AI Assistant response.',
                confidence_level: null,
                low_confidence_warning: true,
              };
            }

            const status      = analysis.status || 'UNKNOWN';
            const rootCause   = analysis.root_cause || '_Could not be determined_';
            const component   = analysis.affected_component || 'n/a';
            const fix         = analysis.fix_suggestion || '_No suggestion available_';
            const confidence  = analysis.confidence_level != null
                                  ? `${(analysis.confidence_level * 100).toFixed(0)}%`
                                  : 'n/a';
            const sha         = context.sha.slice(0, 7);
            const runUrl      = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const statusEmoji = status === 'ANALYZED' ? '✅' : '❌';

            const bodyLines = [
              '## 🤖 CI/CD AI Assistant — Failure Analysis',
              '',
              `${statusEmoji} **Status:** ${status} \u00a0|\u00a0 🎯 **Confidence:** ${confidence} \u00a0|\u00a0 📝 **Commit:** \`${sha}\``,
            ];
            if (analysis.low_confidence_warning) {
              bodyLines.push('', '> ⚠️ **Low confidence** — AI is uncertain. Verify before applying the fix.');
            }
            bodyLines.push(
              '',
              '---',
              '',
              '### 🔍 Root Cause',
              rootCause,
              '',
              '### 📦 Affected Component',
              component,
              '',
              '### 🛠️ Suggested Fix',
              fix,
              '',
              '---',
              `<sub>🔗 [View full workflow run](${runUrl}) \u00a0•\u00a0 Powered by CI/CD AI Assistant + Google Gemini</sub>`,
            );
            const body = bodyLines.join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Print analysis to workflow log (for push events)
        if: failure() && steps.run_tests.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "  CI/CD AI Assistant — Failure Analysis"
          echo "=========================================="
          cat analysis.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'Status           : {d.get(\"status\")}')
          print(f'Root cause       : {d.get(\"root_cause\")}')
          print(f'Affected         : {d.get(\"affected_component\")}')
          print(f'Fix suggestion   : {d.get(\"fix_suggestion\")}')
          print(f'Confidence       : {d.get(\"confidence_level\")}')
          print(f'Low confidence   : {d.get(\"low_confidence_warning\")}')
          " 2>/dev/null || cat analysis.json

      # Make sure the overall job still fails if tests failed, since we
      # used `if: failure()` conditions above rather than letting the
      # test step's non-zero exit propagate naturally.
      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
