name: CI with AI Failure Analysis

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test-and-analyze:
    name: Build, Test, and Analyze on Failure
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        id: run_tests
        run: |
          set -o pipefail
          pytest --tb=long -v 2>&1 | tee build.log

      - name: Send failure log to CI/CD AI Assistant
        id: analysis
        if: failure() && steps.run_tests.outcome == 'failure'
        env:
          API_URL: ${{ secrets.CICD_ASSISTANT_API_URL }}
          API_KEY: ${{ secrets.CICD_ASSISTANT_API_KEY }}
        run: |
          if [ -f build.log ]; then
            LOG_CONTENT=$(tail -c 6000 build.log)
          else
            LOG_CONTENT="build.log was not found on disk after the test step failed."
          fi

          PAYLOAD=$(jq -n \
            --arg pipeline "${{ github.workflow }}" \
            --arg repo     "${{ github.repository }}" \
            --arg sha      "${{ github.sha }}" \
            --arg log      "$LOG_CONTENT" \
            '{
              pipeline_name: $pipeline,
              repository:    $repo,
              commit_sha:    $sha,
              log:           $log,
              org_id:        "default"
            }')

          echo "----- Payload log preview (first 300 chars) -----"
          echo "$LOG_CONTENT" | head -c 300
          echo ""

          HTTP_STATUS=$(curl -s -o analysis.json -w "%{http_code}" \
            -X POST "$API_URL/analyze" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            -d "$PAYLOAD" \
            --max-time 60)

          echo "HTTP status: $HTTP_STATUS"
          cat analysis.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo '{"status":"FAILED","root_cause":null,"fix_suggestion":"AI Assistant API was unreachable.","confidence_level":null,"low_confidence_warning":true}' > analysis.json
          fi

      - name: Post AI analysis as PR comment
        if: failure() && steps.run_tests.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let analysis;
            try {
              analysis = JSON.parse(fs.readFileSync('analysis.json', 'utf8'));
            } catch (e) {
              analysis = { status: 'FAILED', root_cause: null, fix_suggestion: 'Could not parse AI Assistant response.', confidence_level: null, low_confidence_warning: true };
            }

            const status = analysis.status || 'UNKNOWN';
            const rootCause = analysis.root_cause || '_Could not be determined_';
            const component = analysis.affected_component || 'n/a';
            const fix = analysis.fix_suggestion || '_No suggestion available_';
            const confidence = analysis.confidence_level != null ? `${(analysis.confidence_level * 100).toFixed(0)}%` : 'n/a';
            const sha = context.sha.slice(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statusEmoji = status === 'ANALYZED' ? '✅' : '❌';

            const bodyLines = [
              '## 🤖 CI/CD AI Assistant — Failure Analysis',
              '',
              `${statusEmoji} **Status:** ${status} \u00a0|\u00a0 🎯 **Confidence:** ${confidence} \u00a0|\u00a0 📝 **Commit:** \`${sha}\``,
            ];
            if (analysis.low_confidence_warning) {
              bodyLines.push('', '> ⚠️ **Low confidence** — verify before applying.');
            }
            bodyLines.push('', '---', '', '### 🔍 Root Cause', rootCause, '', '### 📦 Affected Component', component, '', '### 🛠️ Suggested Fix', fix, '', '---', `<sub>🔗 [View run](${runUrl})</sub>`);
            const body = bodyLines.join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
            });

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
